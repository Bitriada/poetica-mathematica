<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>π-clock</title>
<style>
  :root { color-scheme: dark; }
  body { width: 320px; margin: 0; background: #0b1220; color: #e2e8f0;
         font: 12.5px/1.5 "Segoe UI", system-ui, sans-serif; }
  .wrap { padding: 12px 14px 14px; }
  h1 { font-size: 14px; margin: 0 0 2px; color: #facc15; }
  .sub { color: #64748b; font-size: 10.5px; margin-bottom: 10px; }
  .big { font: 700 26px/1.15 ui-monospace, monospace; letter-spacing: .5px; }
  .big .lock { color: #facc15; } .big .free { color: #64748b; }
  .law { color: #7dd3fc; font: 11px ui-monospace, monospace;
         margin: 4px 0 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cell { background: #101a2e; border: 1px solid #22304a;
          border-radius: 8px; padding: 6px 9px; }
  .k { color: #64748b; font-size: 9.5px; text-transform: uppercase;
       letter-spacing: .08em; }
  .v { font: 600 13px ui-monospace, monospace; margin-top: 2px; }
  .ctrl { display: flex; gap: 6px; margin-top: 10px; }
  button { flex: 1; padding: 7px 0; border-radius: 7px; border: 1px
           solid #334155; background: #1e293b; color: #e2e8f0;
           cursor: pointer; font-size: 12px; }
  button:hover { background: #273449; }
  button.primary { background: #b45309; border-color: #d97706;
                   color: #fff7ed; font-weight: 600; }
  a.demo { display: block; text-align: center; margin-top: 10px;
           color: #7dd3fc; font-size: 11.5px; text-decoration: none; }
  .tiny { color: #64748b; font-size: 10px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>π-clock</h1>
  <div class="sub">the Trinumeral Clock · exact BigInt · I = |F<sub>n</sub>| = 1 + Φ(n)</div>
  <div class="big" id="bigPi">…</div>
  <div class="law" id="lawLine">connecting…</div>
  <div class="grid">
    <div class="cell"><div class="k">I · ticks (exact)</div>
      <div class="v" id="vI">–</div></div>
    <div class="cell"><div class="k">order n · |Fₙ|</div>
      <div class="v" id="vN">–</div></div>
    <div class="cell"><div class="k">error vs π</div>
      <div class="v" id="vErr">–</div></div>
    <div class="cell"><div class="k">σ · wraps</div>
      <div class="v" id="vSig">–</div></div>
  </div>
  <div class="ctrl">
    <button class="primary" id="btnPlay">pause</button>
    <button id="btnSpeed">×4</button>
    <button id="btnStep">+1</button>
    <button id="btnReset">reset</button>
  </div>
  <a class="demo" href="#" id="openDemo">open the full demo page →</a>
  <div class="tiny">2F/I = π(1 − 3/I) exactly · error = −3π/I<br>
    the widget floats on every page; this clock keeps running in the
    background across tabs.</div>
</div>
<script>
/* Standalone/test stub: when popup.html is opened as a plain file
 * (outside the extension), provide the chrome.* surface popup.js
 * needs, backed by a LOCAL clock, so the popup is double-clickable
 * and testable. Inside the extension the real chrome exists and this
 * block is skipped entirely. */
if (!(window.chrome && window.chrome.runtime &&
      window.chrome.runtime.connect)) {
  window.__piclock_stub = true;
  const listeners = [];
  let clock = null, sieve = null;
  const port = {
    onMessage: { addListener: (f) => listeners.push(f) },
    onDisconnect: { addListener: () => {} },
    postMessage: (m) => {
      if (m.cmd === "hello") setTimeout(pump, 30);
      else if (m.cmd === "control" && m.action === "step")
        step(m.n || 1);
      else if (m.cmd === "control" && m.action === "play") running = true;
      else if (m.cmd === "control" && m.action === "pause") running = false;
      else if (m.cmd === "control" && m.action === "speed") tps = m.tps;
      else if (m.cmd === "control" && m.action === "reset")
        clock = new PiLock.PiClock({ region: "half", value: "1/10",
                                     sieve });
    },
  };
  let running = true, tps = 4, acc = 0, lastT = performance.now();
  function step(n) { for (let k = 0; k < n; k++) clock.tick(); pump(); }
  function pump() {
    if (!listeners.length) return;
    for (const f of listeners) f({
      type: "snapshot",
      snap: PiLock.serializeSnapshot(clock.snapshot()),
      running, tps,
    });
  }
  window.chrome = {
    runtime: { connect: () => port, getURL: (p) => p },
    tabs: { create: (o) => { window.__piclock_stub_open = o.url; } },
  };
  addEventListener("DOMContentLoaded", () => {
    sieve = new PiLock.TotientSieve(4096);
    clock = new PiLock.PiClock({ region: "half", value: "1/10", sieve });
    setInterval(() => {
      const t = performance.now(), dt = (t - lastT) / 1000; lastT = t;
      if (running && clock) { acc += dt * tps;
        const n = Math.floor(acc); acc -= n;
        for (let k = 0; k < n; k++) clock.tick(); pump(); }
    }, 150);
  });
}
</script>
<script src="../core/rational.js"></script>
<script src="../core/piclock.js"></script>
<script src="popup.js"></script>
</body>
</html>
