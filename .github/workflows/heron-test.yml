name: heron method 10-step test
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install orjson
      - name: Setup Folder
        run: cd 5_Code/Fare_Audit && ln -s . rtfa
      - name: Run Heron Method 10 Steps
        run: |
          cd 5_Code/Fare_Audit
          
          cat > test_heron.py << 'PYEOF'
          from fractions import Fraction
          from rtfa import FareAudit
          import dataclasses

          audit = FareAudit(run_id="heron-sqrt2")

          print(f"{'Step':<5} | {'Fare':<6} | {'ULP':<12} | {'Abs Error':<12} | {'Frac Size':<10} | {'F64 Value'}")
          print("-" * 90)

          x_exact = Fraction(1, 1)
          x_float = 1.0

          # A helper function to dynamically find the ULP and Abs Error
          def extract_metrics(record):
              ulp = "N/A"
              abs_err = "N/A"
              
              # Convert to dict if it's a dataclass
              data = dataclasses.asdict(record) if dataclasses.is_dataclass(record) else vars(record)
              
              # Search top-level keys
              for k, v in data.items():
                  if 'ulp' in k.lower(): ulp = v
                  if 'error' in k.lower() or 'err' in k.lower(): abs_err = v
                  
                  # Search one level deep (in case metrics are nested)
                  if isinstance(v, dict):
                      for k2, v2 in v.items():
                          if 'ulp' in k2.lower(): ulp = v2
                          if 'error' in k2.lower() or 'err' in k2.lower(): abs_err = v2
                  elif hasattr(v, '__dict__'):
                      for k2, v2 in vars(v).items():
                          if 'ulp' in k2.lower(): ulp = v2
                          if 'error' in k2.lower() or 'err' in k2.lower(): abs_err = v2
              return ulp, abs_err

          for i in range(1, 11):
              # 1. Exact math
              x_exact = (x_exact + Fraction(2, 1) / x_exact) / 2
              exact_str = f"Q:{x_exact.numerator}/{x_exact.denominator}"
              
              # 2. Audit transition
              record = audit.transition(source=exact_str, target="F64", operation="cast")
              
              # 3. Float math
              x_float = (x_float + 2.0 / x_float) / 2.0
              
              # 4. Extract Fare Flags
              f = record.fare
              fare_str = getattr(f, 'exactness', '') 
              if getattr(f, 'overflow', False): fare_str += "O"
              if getattr(f, 'underflow', False): fare_str += "U"
              if getattr(f, 'domain_violation', False): fare_str += "D"
              if getattr(f, 'sign_lost', False): fare_str += "S"
              if getattr(f, 'phase_obfuscated', False): fare_str += "P"
              if getattr(f, 'magnitude_collapsed', False): fare_str += "M"
              if getattr(f, 'level_collision', False): fare_str += "X"
              if getattr(f, 'saturation_event', False): fare_str += "SAT"
              
              # 5. Extract Errors
              ulp, abs_err = extract_metrics(record)
              if abs_err != 'N/A' and isinstance(abs_err, float):
                  abs_err = f"{abs_err:.2e}"
              
              frac_size = len(str(x_exact.numerator))
              
              print(f"{i:<5} | {fare_str:<6} | {str(ulp):<12} | {str(abs_err):<12} | {frac_size:<10} | {x_float:.17g}")
          PYEOF
          
          python3 test_heron.py
