name: heron method seed variation test
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install orjson
      - name: Setup Folder
        run: cd 5_Code/Fare_Audit && ln -s . rtfa
      - name: Run Heron Method Across Seeds
        run: |
          cd 5_Code/Fare_Audit
          
          cat > test_seeds.py << 'PYEOF'
          from fractions import Fraction
          from rtfa import FareAudit
          import dataclasses

          def extract_ulp(record):
              data = dataclasses.asdict(record) if dataclasses.is_dataclass(record) else vars(record)
              ulp = "N/A"
              for k, v in data.items():
                  if 'ulp' in k.lower(): ulp = v
                  if isinstance(v, dict):
                      for k2, v2 in v.items():
                          if 'ulp' in k2.lower(): ulp = v2
                  elif hasattr(v, '__dict__'):
                      for k2, v2 in vars(v).items():
                          if 'ulp' in k2.lower(): ulp = v2
              return ulp

          def run_seed(seed_int):
              audit = FareAudit(run_id=f"heron-seed-{seed_int}")
              x_exact = Fraction(seed_int, 1)
              x_float = float(seed_int)
              prev_float = None
              
              print(f"\n--- Starting Seed: x_0 = {seed_int} ---")
              print(f"{'Step':<5} | {'Status':<8} | {'Fare':<5} | {'ULP':<10} | {'Frac Size':<10} | {'F64 Value'}")
              print("-" * 75)
              
              for i in range(1, 11):
                  # 1. Exact math
                  x_exact = (x_exact + Fraction(2, 1) / x_exact) / 2
                  exact_str = f"Q:{x_exact.numerator}/{x_exact.denominator}"
                  
                  # 2. Audit transition
                  record = audit.transition(source=exact_str, target="F64", operation="cast")
                  
                  # 3. Float math
                  x_float = (x_float + 2.0 / x_float) / 2.0
                  
                  # 4. Extract Fare
                  f = record.fare
                  fare_str = getattr(f, 'exactness', '') 
                  if getattr(f, 'overflow', False): fare_str += "O"
                  if getattr(f, 'underflow', False): fare_str += "U"
                  if getattr(f, 'sign_lost', False): fare_str += "S"
                  if getattr(f, 'saturation_event', False): fare_str += "SAT"
                  
                  # 5. Extract ULP
                  ulp = extract_ulp(record)
                  
                  # 6. Determine Status
                  status = "Hunting"
                  if prev_float is not None and x_float == prev_float:
                      status = "FROZEN"
                  
                  frac_size = len(str(x_exact.numerator))
                  print(f"{i:<5} | {status:<8} | {fare_str:<5} | {str(ulp):<10} | {frac_size:<10} | {x_float:.17g}")
                  
                  prev_float = x_float

          # Run the three seeds
          run_seed(1)
          run_seed(2)
          run_seed(10)
          PYEOF
          
          python3 test_seeds.py
