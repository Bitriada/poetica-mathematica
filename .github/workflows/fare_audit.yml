name: verify fare-audit
on:
  push:
    paths:
      - '5_Code/Fare_Audit/**'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install pytest orjson
      - name: Run Tests
        run: cd 5_Code/Fare_Audit && python3 -m pytest -q
      - name: Run Demo
        run: cd 5_Code/Fare_Audit && python3 __main__.py demo --out out
      - name: Verify Ledger
        run: cd 5_Code/Fare_Audit && python3 __main__.py verify --ledger out/ledger.jsonl
