name: verify code
on:
  push:
    paths:
      - '5_Code/Lattice_117/**'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: cd 5_Code/Lattice_117 && python3 lattice117.py > /tmp/out.txt
      - run: cd 5_Code/Lattice_117 && diff /tmp/out.txt lattice117_output.txt
